name: Package SHESHA Full Stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "supabase/**"
      - "docs/**"
      - ".env.example"
      - "package.json"
      - "netlify.toml"
      - ".github/workflows/package-fullstack.yml"

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build full-stack archive
        run: |
          mkdir -p release
          zip -r release/SHESHA_Full_Stack_Mobicom_Pay.zip . -x ".git/*" "release/*" "node_modules/*" ".env" ".env.local" ".env.production" "*.tsbuildinfo"
      - uses: actions/upload-artifact@v4
        with:
          name: SHESHA-Full-Stack-Mobicom-Pay
          path: release/SHESHA_Full_Stack_Mobicom_Pay.zip
          if-no-files-found: error
          retention-days: 30
